app-id: io.github.thoaikhmt.LidMode
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: lidmode-app

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Needed for org.freedesktop.login1.Manager.Inhibit(): this is what keeps the
  # machine from suspending when the lid closes.
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: lidmode
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/lidmode-app /app/bin/lidmode-app
      - install -Dm644 data/io.github.thoaikhmt.LidMode.desktop /app/share/applications/io.github.thoaikhmt.LidMode.desktop
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.thoaikhmt.LidMode.svg /app/share/icons/hicolor/scalable/apps/io.github.thoaikhmt.LidMode.svg
      - install -Dm644 data/io.github.thoaikhmt.LidMode.metainfo.xml /app/share/metainfo/io.github.thoaikhmt.LidMode.metainfo.xml
    sources:
      - type: git
        url: https://github.com/thoaikhmt/lidmode.git
        tag: v1.3.0
